.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}

.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}
.bd em{font-style:normal;font-size:28px}.bd small{display:block;color:var(--mute);font-size:12px}

.wel ul{padding:0;margin:14px 0}

.note{color:var(--mute);font-size:13px;margin:14px 0 0;text-align:center}

 ov.innerHTML='<div class="sheet wel" role="dialog" aria-label="مرحبًا"><div class="brand" style="justify-content:center">'+brand().replace('<div class="brand">','').slice(0,-6)+'</div><h1>أهلًا بك في «لا تكسر السلسلة»</h1><p class="sub">تمارين منزلية قصيرة، بلا أي أدوات.</p><ul><li><em>'+ic('bolt')+'</em>اختر برنامجًا ومستوى يناسبك</li><li><em>'+ic('body')+'</em>شاهد كل تمرين مجسمًا ثلاثي الأبعاد قبل أن تبدأ</li><li><em>'+ic('link')+'</em>سجّل يومك وابنِ سلسلة لا تريد كسرها</li></ul><button class="cta alt" id="wk">لنبدأ</button></div>';
 document.body.appendChild(ov);$('wk').onclick=function(){ov.remove()}}
function sw(id,t,sub,on){return '<button class="sw" role="switch" id="'+id+'" aria-checked="'+on+'"><span><b>'+t+'</b><small>'+sub+'</small></span><i class="tg"></i></button>'}
function me(){
 stopP();NAV.hidden=false;tab('me');
 var ok=S.pic&&S.pic.indexOf('data:image/')===0;
 var h='<h1>حسابي</h1><div class="prof"><div class="avatar">'+(ok?'<img src="'+S.pic+'" alt="صورتي الشخصية">':'<span aria-hidden="true">'+ic('user')+'</span>')+'</div><input type="file" id="pf" class="file" accept="image/*"><label class="cta alt pick" for="pf">'+(ok?'تغيير الصورة':'اختيار صورة')+'</label>'+(ok?'<button class="cta undo" id="pd">حذف الصورة</button>':'')+'</div>';
 h+='<div class="box">'+[['name','الاسم'],['uid','الرقم / المعرّف'],['college','الكلية'],['dept','القسم'],['fri','الجمعة']].map(function(f){return '<label class="fl">'+f[1]+'<input class="fld" data-f="'+f[0]+'" maxlength="40" autocomplete="off" value="'+esc(S[f[0]]||'')+'"></label>'}).join('')+'</div>';
 h+='<h2>المظهر</h2><div class="seg">'+[['auto','تلقائي'],['light',ic('sun')+' فاتح'],['dark',ic('moon')+' داكن']].map(function(m){return '<button data-t="'+m[0]+'" class="'+(S.theme===m[0]?'on':'')+'" aria-pressed="'+(S.theme===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>';
 h+='<h2>أثناء التمرين</h2><div>'+sw('sn','الصوت','صافرات العد والانتقال وصوت النقر',S.snd)+sw('vb','الاهتزاز','تنبيه عند تغيّر التمرين',S.vib)+sw('sp','نطق اسم التمرين','بصوت الجهاز عند بداية كل تمرين',S.spk)+'</div>';
 h+='<h2>التذكير</h2><div>'+sw('rm','ذكّرني بالتمرين','يعمل أثناء فتح التطبيق',S.rem.on)+'<label class="fl">وقت التذكير<input class="fld" type="time" id="rt" value="'+esc(S.rem.t)+'"></label></div>';
 h+='<h2>بياناتك</h2><p class="sub">كل بياناتك محفوظة على جهازك فقط ولا تُرسل لأي خادم.</p><button class="cta undo" id="ex">نسخ بياناتي</button><button class="cta undo" id="dx">تنزيل نسخة احتياطية</button><input type="file" id="imf" class="file" accept="application/json,.json"><label class="cta undo" for="imf">استيراد من ملف</label>'+(bak()?'<button class="cta undo" id="ub">تراجع عن آخر استيراد</button>':'')+'<button class="cta undo" id="rs" style="color:#c0392b;border-color:#c0392b">مسح كل البيانات</button><p class="note">السعرات تقديرية. استشر طبيبك عند وجود حالة صحية وتوقف عند الشعور بألم.</p>';
 put(h);
 $('pf').onchange=function(){var f=this.files&&this.files[0];this.value='';if(!f)return;
  if(f.type&&f.type.indexOf('image/')!==0){toast('الملف ليس صورة صالحة');return}
  if(f.size>15*1048576){toast('الصورة كبيرة جدًا (الحد ١٥ ميجابايت)');return}
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){try{var m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.pic=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);if(!save()){S.pic='';toast('تعذّر حفظ الصورة (مساحة التخزين ممتلئة)');return}me();toast('تم تحديث الصورة')}catch(e){toast('تعذّر معالجة الصورة')}};
  im.onerror=function(){URL.revokeObjectURL(u);toast('تعذّر قراءة الصورة')};im.src=u};
 if($('pd'))$('pd').onclick=function(){if(confirm('حذف الصورة؟')){S.pic='';save();keepY(me);toast('تم حذف الصورة')}};
 A.querySelectorAll('[data-f]').forEach(function(i){i.onchange=function(){S[i.dataset.f]=i.value.trim().slice(0,40);save();toast('تم الحفظ')}});
 A.querySelectorAll('[data-t]').forEach(function(bt){bt.onclick=function(){S.theme=bt.dataset.t;save();theme();A.querySelectorAll('[data-t]').forEach(function(o){var on=o===bt;o.className=on?'on':'';o.setAttribute('aria-pressed',on)})}});
 $('sn').onclick=function(){S.snd=!S.snd;save();flip(this,S.snd);if(S.snd)beep(660)};
 $('vb').onclick=function(){S.vib=!S.vib;save();flip(this,S.vib);if(S.vib)buzz()};
 $('sp').onclick=function(){S.spk=!S.spk;save();flip(this,S.spk);if(S.spk)say('تم التفعيل')};
 $('rm').onclick=function(){var b=this;
  if(S.rem.on){S.rem.on=false;save();flip(b,false);return}
  if(!('Notification' in window)){toast('متصفحك لا يدعم الإشعارات');return}
  Notification.requestPermission().then(function(p){S.rem.on=p==='granted';save();flip(b,S.rem.on);toast(S.rem.on?'تم تفعيل التذكير':'لم يتم السماح بالإشعارات')},function(){toast('تعذّر تفعيل الإشعارات')})};
 $('rt').onchange=function(){if(/^\d\d:\d\d$/.test(this.value)){S.rem.t=this.value;save();toast('تم حفظ وقت التذكير')}};
 $('ex').onclick=function(){var d=Object.assign({},S);d.pic='';try{navigator.clipboard.writeText(JSON.stringify(d)).then(function(){toast('تم النسخ إلى الحافظة')},function(){toast('تعذّر النسخ')})}catch(e){toast('تعذّر النسخ')}};
 $('dx').onclick=function(){try{var d=Object.assign({},S);d.pic='';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='dont-break-chain-'+key(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل النسخة')}catch(e){toast('تعذّر التنزيل')}};
 $('imf').onchange=function(){var f=this.files&&this.files[0];this.value='';if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.days)||!Array.isArray(d.hist))throw 0;if(!confirm('سيتم استبدال بياناتك الحالية بالنسخة المستوردة. متأكد؟'))return;try{localStorage.setItem(K+'-bak',JSON.stringify(S))}catch(e){}d.pic=S.pic;S=Object.assign(S,d);save();theme();home();toast('تم الاستيراد — للتراجع: حسابي ← بياناتك')}catch(e){toast('الملف غير صالح')}};r.onerror=function(){toast('تعذّرت قراءة الملف')};r.readAsText(f)};
 if($('ub'))$('ub').onclick=function(){try{var b=JSON.parse(localStorage.getItem(K+'-bak'));if(!b||!b.days)throw 0;if(!confirm('استعادة بياناتك كما كانت قبل الاستيراد؟'))return;b.pic=S.pic;S=b;try{localStorage.removeItem(K+'-bak')}catch(e){}save();theme();keepY(me);toast('تم التراجع عن الاستيراد')}catch(e){toast('تعذّر التراجع')}};
$('rs').onclick=function(){if(confirm('سيتم حذف كل بياناتك نهائيًا. متأكد؟')){try{localStorage.removeItem(K)}catch(e){}S={lvl:0,goal:4,days:[],hist:[],theme:'auto',snd:true,vib:true,seen:true,name:'',uid:'',college:'',dept:'',fri:'',pic:'',rem:{on:false,t:'18:00'}};save();theme();home()}}}
function flip(b,v){b.setAttribute('aria-checked',String(v))}
$('n-home').onclick=home;$('n-plan').onclick=planPage;$('n-stats').onclick=stats;$('n-me').onclick=me;
document.addEventListener('visibilitychange',function(){if(document.hidden&&pl){if(!pl.pause){pl.pause=true;drawP()}snap()}});
window.addEventListener('pagehide',snap);var rmLast='';
setInterval(function(){if(!S.rem.on||!('Notification' in window)||Notification.permission!=='granted')return;var n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),k=key(n)+t;if(t===S.rem.t&&k!==rmLast&&!has(key(n))){rmLast=k;try{new Notification('لا تكسر السلسلة',{body:'حان وقت تمرين اليوم',icon:'icon-192.png'})}catch(e){}}},20000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
home();
})();
